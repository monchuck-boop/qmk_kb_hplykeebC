name: Build Keyball61 Right Hand Only (Simple Test)

on:
  push:
    branches: [ '**' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: ghcr.io/qmk/qmk_cli:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Disable git safe directory checks
        run: git config --global --add safe.directory '*'

      - name: Fix QMK CLI & Source Code Internal Python Bug (Deep Search Fix)
        run: |
          echo "Searching and fixing math.py..."
          find / -name "math.py" -path "*qmk*" 2>/dev/null | while read -r file; do
            sed -i 's/ast.Num/ast.Constant/g; s/node.n/node.value/g' "$file"
          done

      - name: STEP1 - Find and Modify config.h Only
        run: |
          # フォルダ移動などはせず、今リポジトリ内にある 'config.h' を全階層から自動で見つけます
          CONFIG_PATH=$(find . -name "config.h" | head -n 1)
          
          echo "=============================================="
          echo "Verified target path: '$CONFIG_PATH'"
          echo "=============================================="
          
          if [ -n "$CONFIG_PATH" ] && [ -f "$CONFIG_PATH" ]; then
            # 右手単独動作の設定を追加
            echo "#define MASTER_RIGHT" >> "$CONFIG_PATH"
            
            # 【パターン①】MATRIX_COL_PINS の右から2番目（COL2）を GP17 に差し替え
            sed -i 's/#define MATRIX_COL_PINS.*/#define MATRIX_COL_PINS { GP29, GP28, GP17, GP26 }/g' "$CONFIG_PATH"
            echo "Successfully patched config.h!"
          else
            echo "ERROR: config.h could not be found anywhere in this repository."
            exit 1
          fi

      - name: STEP2 - Compile Keyball61
        run: |
          # フォルダ構造に依存しないよう、QMKに登録されている正確なフォルダ名を渡してコンパイル
          qmk compile -kb keyball61 -km default || qmk compile -kb keyball/keyball61 -km default
