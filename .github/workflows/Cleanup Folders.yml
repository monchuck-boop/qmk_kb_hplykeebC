name: Build Keyball61 Right Hand Only (Fixed Path)

# ⬇️ ここを「ボタン」から「プッシュされたら自動スタート」に変更しました
on:
  push:
    branches: [ '**' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: ghcr.io/qmk/qmk_cli:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Disable git safe directory checks
        run: git config --global --add safe.directory '*'

      - name: Fix QMK CLI & Source Code Internal Python Bug (Deep Search Fix)
        run: |
          echo "Searching and fixing math.py across the system..."
          find / -name "math.py" -path "*qmk*" 2>/dev/null | while read -r file; do
            sed -i 's/ast.Num/ast.Constant/g; s/node.n/node.value/g' "$file"
          done

      - name: Configure Hardware (Keyball61 Right Hand & GP17 Fix)
        run: |
          CONFIG_PATH="keyboards/keyball/keyball61/config.h"
          echo "Targeting config.h at: $CONFIG_PATH"
          
          if [ -f "$CONFIG_PATH" ]; then
            echo "#define MASTER_RIGHT" >> "$CONFIG_PATH"
            sed -i 's/#define MATRIX_COL_PINS.*/#define MATRIX_COL_PINS { GP29, GP28, GP17, GP26 }/g' "$CONFIG_PATH"
            echo "Successfully patched Keyball61 config.h!"
          else
            echo "ERROR: Keyball61 config.h not found at $CONFIG_PATH"
            exit 1
          fi

      - name: Compile Keyball61
        run: |
          qmk compile -kb keyball/keyball61 -km default
