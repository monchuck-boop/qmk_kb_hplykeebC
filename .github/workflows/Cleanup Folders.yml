name: Build Keyball61 Right Hand Only (Auto Target)

on:
  push:
    branches: [ '**' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: ghcr.io/qmk/qmk_cli:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Disable git safe directory checks
        run: git config --global --add safe.directory '*'

      - name: Fix QMK CLI & Source Code Internal Python Bug (Deep Search Fix)
        run: |
          echo "Searching and fixing math.py..."
          find / -name "math.py" -path "*qmk*" 2>/dev/null | while read -r file; do
            sed -i 's/ast.Num/ast.Constant/g; s/node.n/node.value/g' "$file"
          done

      - name: STEP1 - Find and Modify config.h Only
        run: |
          # リポジトリ内から 'keyball' に関連する config.h を自動探索
          CONFIG_PATH=$(find . -name "config.h" | grep -i "keyball" | head -n 1)
          if [ -z "$CONFIG_PATH" ]; then
            CONFIG_PATH=$(find . -name "config.h" | head -n 1)
          fi
          
          echo "=============================================="
          echo "Verified target path: '$CONFIG_PATH'"
          echo "=============================================="
          
          if [ -n "$CONFIG_PATH" ] && [ -f "$CONFIG_PATH" ]; then
            # 右手単独動作の設定を追加
            echo "#define MASTER_RIGHT" >> "$CONFIG_PATH"
            
            # 【パターン①】MATRIX_COL_PINS の右から2番目を GP17 に差し替え
            sed -i 's/#define MATRIX_COL_PINS.*/#define MATRIX_COL_PINS { GP29, GP28, GP17, GP26 }/g' "$CONFIG_PATH"
            echo "Successfully patched config.h!"
          else
            echo "ERROR: config.h could not be found anywhere in this repository."
            exit 1
          fi

      - name: STEP2 - Find Keyboard Directory Name & Compile
        run: |
          # 書き換えた config.h がある親フォルダ名から、QMK用のキーボード名を逆算します
          CONFIG_PATH=$(find . -name "config.h" | grep -i "keyball" | head -n 1)
          if [ -z "$CONFIG_PATH" ]; then CONFIG_PATH=$(find . -name "config.h" | head -n 1); fi
          
          # パス（例: keyboards/keyball/keyball61/config.h）から 'keyboards/' と '/config.h' を除外
          KB_NAME=$(echo "$CONFIG_PATH" | sed -e 's|/config.h||' -e 's|keyboards/||' -e 's|^\./||')
          
          echo "=============================================="
          echo "Target Keyboard Name Detected: '$KB_NAME'"
          echo "=============================================="
          
          if [ -n "$KB_NAME" ]; then
            qmk compile -kb "$KB_NAME" -km default
          else
            # 逆算に失敗した場合はリポジトリ全体のキーボードリストを出力してエラー停止
            echo "Available keyboards in this workspace:"
            qmk list-keyboards
            exit 1
          fi
