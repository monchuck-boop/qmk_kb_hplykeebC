name: 一括フォルダ整理 (holykeebs以外を削除)

on:
  push:
    branches: [ '**' ]
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリのチェックアウト
        uses: actions/checkout@v4

      - name: holykeebs 以外のフォルダを一括削除
        run: |
          echo "=== 🧹 フォルダの一括整理を開始します ==="
          
          if [ -d "keyboards" ]; then
            # keyboards フォルダ直下にあるフォルダのうち、名前に 'holykeebs' が含まれないものをすべて一括削除します
            find keyboards/ -maxdepth 1 -mindepth 1 -not -name "*holykeebs*" -exec rm -rf {} +
            echo "holykeebs 以外の不要なキーボードフォルダをすべて削除しました。"
          else
            echo "keyboards フォルダが見つかりませんでした。"
          fi

      - name: 整理後の結果を自動でGitHubに反映（コミット＆プッシュ）
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@://github.com"
          
          git add -A
          if git diff-index --quiet HEAD; then
            echo "すでに綺麗な状態のため、変更はありません。"
          else
            git commit -m "Cleanup: keyboardsフォルダ内をholykeebsだけに一括整理"
            git push
            echo "フォルダの削除結果をリポジトリに保存しました！"
          fi
