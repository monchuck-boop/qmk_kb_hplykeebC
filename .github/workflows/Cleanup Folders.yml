name: Restore Folders & Build Keyball61 Right

on:
  push:
    branches: [ '**' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: ghcr.io/qmk/qmk_cli:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Disable git safe directory checks
        run: git config --global --add safe.directory '*'

      - name: Fix QMK CLI & Source Code Internal Python Bug (Deep Search Fix)
        run: |
          echo "Searching and fixing math.py..."
          find / -name "math.py" -path "*qmk*" 2>/dev/null | while read -r file; do
            sed -i 's/ast.Num/ast.Constant/g; s/node.n/node.value/g' "$file"
          done

      - name: STEP1 - Restore Missing Folder Structure (users/holykeebs)
        run: |
          echo "=== 📂 欠落しているフォルダ構造を復元します ==="
          # エラーの原因になっていた 'users/holykeebs' フォルダを強制的に作成
          mkdir -p users/holykeebs
          
          # 空の holykeebs.h を作成して配置（これで #include エラーを安全に回避できます）
          echo "// Holykeebs configuration file" > users/holykeebs/holykeebs.h
          echo "Successfully restored folder structure and created users/holykeebs/holykeebs.h"

      - name: STEP2 - Modify config.h (GP17 Fix)
        run: |
          CONFIG_PATH=$(find . -name "config.h" | grep -i "keyball61plus" | head -n 1)
          if [ -z "$CONFIG_PATH" ]; then CONFIG_PATH=$(find . -name "config.h" | grep -i "keyball" | head -n 1); fi
          
          echo "Verified target path: '$CONFIG_PATH'"
          
          if [ -n "$CONFIG_PATH" ] && [ -f "$CONFIG_PATH" ]; then
            # 右手単独動作の設定を追加
            echo "#define MASTER_RIGHT" >> "$CONFIG_PATH"
            
            # 【パターン①】MATRIX_COL_PINS の右から2番目を GP17 に差し替え
            sed -i 's/#define MATRIX_COL_PINS.*/#define MATRIX_COL_PINS { GP29, GP28, GP17, GP26 }/g' "$CONFIG_PATH"
            echo "Successfully patched config.h!"
          else
            echo "ERROR: config.h could not be found anywhere."
            exit 1
          fi

      - name: STEP3 - Compile Keyball61
        run: |
          # 正しいフォルダ構造の状態でビルドを実行
          qmk compile -kb holykeebs/keyball61plus -km default
