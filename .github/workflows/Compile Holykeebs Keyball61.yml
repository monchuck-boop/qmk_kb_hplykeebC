name: Build Holykeebs Keyball61 Vial Fixed

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Holykeebs Keyball61
    runs-on: ubuntu-latest
    container: ghcr.io/qmk/qmk_cli@sha256:2dc05fc9f32efebd6b05c2b8676ee548358bc7e151e9dbf4dac6b6eed4513b07

    steps:
    - name: Checkout Vial repo
      uses: actions/checkout@v4
      with:
        persist-credentials: false
        submodules: recursive

    - name: Checkout Holykeebs Userspace (Safe Method)
      uses: actions/checkout@v4
      with:
        repository: holykeebs/qmk-userspace
        ref: hk-master
        path: users/holykeebs
        persist-credentials: false

    - name: Disable Werror and Build
      run: |
        git config --global --add safe.directory $(pwd)
        
        # 設定ファイル内の「-Werror」という記述を力技で完全に削ぎ落とす（警告による停止を物理的に無効化）
        if [ -f "builddefs/common_rules.mk" ]; then
          sed -i 's/-Werror//g' builddefs/common_rules.mk
        fi
        
        qmk compile -kb holykeebs/keyball61 -km vial -e USER_NAME=holykeebs

    - name: Gather Firmware File
      run: |
        mkdir -p output_firmware
        find .build/ -name "*.uf2" -exec cp {} ./output_firmware/ \;
        find . -name "*.uf2" -exec cp {} ./output_firmware/ \;

    - name: Upload Finished Firmware
      uses: actions/upload-artifact@v4
      with:
        name: keyball61-vial-fixed-firmware
        path: output_firmware/
