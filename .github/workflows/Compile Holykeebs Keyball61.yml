name: Build Keyball61 Right Hand Only (New Base Fix)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: ghcr.io/qmk/qmk_cli:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Disable git safe directory checks
        run: git config --global --add safe.directory '*'

      - name: Fix QMK CLI & Source Code Internal Python Bug (Deep Search Fix)
        run: |
          echo "Searching and fixing math.py across the system..."
          find / -name "math.py" -path "*qmk*" 2>/dev/null | while read -r file; do
            sed -i 's/ast.Num/ast.Constant/g; s/node.n/node.value/g' "$file"
          done

      - name: Configure Hardware (Right Hand & GP17 Auto-Path Fix)
        run: |
          # リポジトリ内にある 'config.h' の場所を自動検索してパスを特定します
          CONFIG_PATH=$(find . -name "config.h" -path "*keyball61*" | head -n 1)
          
          if [ -z "$CONFIG_PATH" ]; then
            CONFIG_PATH=$(find . -name "config.h" | head -n 1)
          fi
          
          echo "Target config.h found at: $CONFIG_PATH"
          
          if [ -n "$CONFIG_PATH" ] && [ -f "$CONFIG_PATH" ]; then
            # 右手単独動作のための設定を追加
            echo "#define MASTER_RIGHT" >> "$CONFIG_PATH"
            
            # 【パターン①】MATRIX_COL_PINS の右から2番目（COL2）を GP17 に差し替え
            sed -i 's/#define MATRIX_COL_PINS.*/#define MATRIX_COL_PINS { GP29, GP28, GP17, GP26 }/g' "$CONFIG_PATH"
          else
            echo "ERROR: config.h not found in this repository."
            exit 1
          fi

      - name: Compile Keyball61
        run: |
          # 新しいリポジトリの構造に合わせてキーボード名を 'keyball61' に変更してコンパイル
          qmk compile -kb keyball61 -km default
