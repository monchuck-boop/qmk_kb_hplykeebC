name: Compile Holykeebs Keyball61

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: qmkfm/qmk_cli:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Fix Python 3.14 Compatibility Error
        run: |
          sed -i 's/ast.Num/ast.Constant/g' lib/python/qmk/math.py
          sed -i 's/node.n/node.value/g' lib/python/qmk/math.py

      - name: Compile Firmware
        run: |
          # qmkの内部データベースにこのフォルダを強制認識させる
          qmk setup -y --home $(pwd)
          # makeではなく、確実なqmk compileコマンドを使用する（キーマップはvialを指定）
          qmk compile -kb holykeebs/keyball61 -km vial

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: keyball61_firmware
          path: |
            *.hex
            *.bin
            *.uf2
            .build/*.hex
            .build/*.bin
            .build/*.uf2
