name: Build Original Keyball61 RP2040 Vial Final Fix

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Keyball61 Original Board Final Fix
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout Vial repo
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup QMK Environment
      run: |
        python3 -m pip install --user qmk
        qmk setup -y -b master

    - name: Download Original Keyball Source
      run: |
        # Yowkees氏の公式リポジトリから本家Keyballの回路データを正しいURLでクローンする
        git clone https://github.com original_keyball
        mkdir -p keyboards
        cp -r original_keyball/qmk/keyboards/keyball keyboards/

    - name: Apply Right Thumb Delay Fix
      run: |
        # 高速なRP2040で本家のDuplexマトリクス信号を読み飛ばさないよう、電気が流れるのを待つ遅延処理を追加
        echo "#define MATRIX_IO_DELAY 30" >> keyboards/keyball/keyball61/config.h

    - name: Build Firmware (Original Keyball61 to RP2040)
      run: |
        # 本家の配線マトリクスでRP2040用に変換コンパイルを実行
        make keyball/keyball61:vial -e CONVERT_TO=rp2040

    - name: Gather Firmware File
      run: |
        mkdir -p output_firmware
        find .build/ -name "*.uf2" -exec cp {} ./output_firmware/ \;
        find . -name "*.uf2" -exec cp {} ./output_firmware/ \;

    - name: Upload Finished Firmware
      uses: actions/upload-artifact@v4
      with:
        name: keyball61-original-rp2040-vial-final-fixed
        path: output_firmware/
