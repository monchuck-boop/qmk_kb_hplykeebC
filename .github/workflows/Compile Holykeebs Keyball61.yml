name: Build Keyball61 Right Hand Only (Fixed Base)

on:
  push:
    branches: [ '**' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: ghcr.io/qmk/qmk_cli:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Disable git safe directory checks
        run: git config --global --add safe.directory '*'

      - name: Fix QMK CLI & Source Code Internal Python Bug (Deep Search Fix)
        run: |
          echo "Searching and fixing math.py..."
          find / -name "math.py" -path "*qmk*" 2>/dev/null | while read -r file; do
            sed -i 's/ast.Num/ast.Constant/g; s/node.n/node.value/g' "$file"
          done

      - name: STEP1 - 欠落している holykeebs.h の定義を復元
        run: |
          # フォルダ削除で一緒に消えてしまった共通定義ファイルを、ビルドの直前に自動で復元します
          mkdir -p users/holykeebs
          cat << 'EOF' > users/holykeebs/holykeebs.h
          #pragma once
          #include "quantum.h"

          #undef NUM_ENCODERMAP_LAYERS_RAW
          #define NUM_ENCODERMAP_LAYERS_RAW NUM_KEYMAP_LAYERS_RAW

          enum holykeebs_keycodes {
              HK_D_MODE = SAFE_RANGE, HK_S_MODE, HK_DUMP, HK_SAVE, HK_RESET,
              HK_BONGO_T, HK_C_SCROLL, HK_P_SET_D, HK_P_SET_S, HK_P_SET_THR,
              HK_S_MODE_T, HK_D_MODE_T, HK_I_SCROLL, HK_AML_T, HK_AML_UP,
              HK_AML_DN, HK_ENC_SCR_D, HK_ENC_SCR_U, HK_NEW_SAFE_RANGE
          };
          EOF

      - name: STEP2 - 右手単体化 & GP17の配線修正を適用
        run: |
          CONFIG_PATH="keyboards/holykeebs/keyball61plus/config.h"
          echo "Targeting config.h at: $CONFIG_PATH"
          
          if [ -f "$CONFIG_PATH" ]; then
            # 右手単独動作の設定を追加
            echo "#define MASTER_RIGHT" >> "$CONFIG_PATH"
            
            # 【パターン①】MATRIX_COL_PINS の右から2番目を GP17 に差し替え
            sed -i 's/#define MATRIX_COL_PINS.*/#define MATRIX_COL_PINS { GP29, GP28, GP17, GP26 }/g' "$CONFIG_PATH"
            echo "Successfully patched Keyball61 config.h!"
          else
            echo "ERROR: config.h not found at $CONFIG_PATH"
            exit 1
          fi

      - name: STEP3 - コンパイルを実行
        run: |
          # 正しいキーボード名に変更してコンパイル
          qmk compile -kb holykeebs/keyball61plus -km default
