name: Build Original Keyball61 RP2040 Vial Pure Fix

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Keyball61 Original Board Pure Fix
    runs-on: ubuntu-latest
    container: ghcr.io/qmk/qmk_cli@sha256:2dc05fc9f32efebd6b05c2b8676ee548358bc7e151e9dbf4dac6b6eed4513b07

    steps:
    - name: Checkout Vial repo
      uses: actions/checkout@v4
      with:
        persist-credentials: false
        submodules: recursive

    - name: Apply Right Thumb Delay and Build
      run: |
        git config --global --add safe.directory $(pwd)
        
        # 高速なRP2040で本家仕様のDuplexマトリクス信号を読み飛ばさないための遅延対策を追加
        echo "#define MATRIX_IO_DELAY 30" >> keyboards/keyball/keyball61/config.h
        
        # OLEDは完全無効。本家の配線マトリクスでRP2040用に変換コンパイルを実行
        qmk compile -kb keyball/keyball61 -km vial -e CONVERT_TO=rp2040

    - name: Gather Firmware File
      run: |
        mkdir -p output_firmware
        find .build/ -name "*.uf2" -exec cp {} ./output_firmware/ \;
        find . -name "*.uf2" -exec cp {} ./output_firmware/ \;

    - name: Upload Finished Firmware
      uses: actions/upload-artifact@v4
      with:
        name: keyball61-original-rp2040-vial-pure-fixed
        path: output_firmware/
