name: Compile Holykeebs Keyball61

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: qmkfm/qmk_cli:latest
      env:
        GIT_CONFIG_COUNT: 1
        GIT_CONFIG_KEY_0: safe.directory
        GIT_CONFIG_VALUE_0: '*'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Fix Python 3.14 Compatibility Error
        run: |
          sed -i 's/ast.Num/ast.Constant/g' lib/python/qmk/math.py
          sed -i 's/node.n/node.value/g' lib/python/qmk/math.py

      - name: Fix Holykeebs Custom Keymap Dependency
        run: |
          # 存在しない個人用ファイル（users/holykeebs/holykeebs.h）の読み込み行を削除する
          sed -i '/users\/holykeebs\/holykeebs.h/d' keyboards/holykeebs/keyball61/keymaps/vial/keymap.c

      - name: Compile Firmware
        run: |
          qmk setup -y --home $(pwd)
          qmk compile -kb holykeebs/keyball61 -km vial

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: keyball61_firmware
          path: |
            *.hex
            *.bin
            *.uf2
            .build/*.hex
            .build/*.bin
            .build/*.uf2
